spring.application.name=replicator
spring.batch.jdbc.initialize-schema=always

app.kafka.topic=app\\.public\\..*

spring.kafka.consumer.group-id= public_unique
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.metadata.max.age.ms=30000

target.datasource.url=jdbc:postgresql://localhost:5433/
target.datasource.username=app
target.datasource.password=app_password
target.datasource.driver-class-name=org.postgresql.Driver


source.datasource.url=jdbc:postgresql://localhost:5432/
source.datasource.username=app
source.datasource.password=app_password
source.datasource.driver-class-name=org.postgresql.Driver